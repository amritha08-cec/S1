<!DOCTYPE html>
<html>
    <head>
        <title>image mapping</title>
    </head>
<body>
    <h1 align="center">IMAGE MAPPING</h1>
  <center>  <img src="https://static.vecteezy.com/system/resources/previews/077/774/121/large_2x/red-hibiscus-flowers-on-stem-photo.jpg" 
    alt="image mapping" width="750" height="450" 
  usemap="#mymap" ></center>
    <map name="mymap">
        <!--CIRCLE-->
        <area shape="circle"
        coords="350,100,50"
        href="circle.html"
        title="circle"
        >
        <!--rectangle-->
        <area shape="rect"
        coords="350,200,410,260"
        href="rectangle.html"
        alt="Rectangle"
        title="Rectangle">
        <!--polygon-->
        <area shape="polygon"
        coords="350,270,410,260,310,390,340,340,310"
        href="polygon.html"
        alt="polygon"
        title="polygon">
        </map>
</body>
</html>
